# ===========================================================================
# Study regions and bi-temporal acquisition window.
# Phase 1 held one region; Phase 8 expands to four Western Ghats blocks.
# All downstream scripts read this file via src/regions.py (load_regions) and
# ITERATE regions. A single-region config (a bare `region:` block, no
# `regions:` list) is still supported and is wrapped into a one-element list.
# Do not hard-code bboxes anywhere else.
# ===========================================================================

earth_engine:
  # Registered, working Earth Engine cloud project (verified in Phase 2).
  project: "forest-loss-ee-test"
  # Optional service-account key path for headless / server use (Phase 9).
  # Read from env EE_SERVICE_ACCOUNT_KEY if set; this value is a fallback only
  # and must point to a git-ignored file.
  service_account_key: null

# ---------------------------------------------------------------------------
# Regions. Each: a Western Ghats moist-forest block of ~850 km2, same biome,
# same forest types, same UTM zone (43N / EPSG:32643). Bboxes were chosen by
# probing Hansen GFC 2019-2020 loss density first (scripts/site_probe or
# docs/phase8_notes.md) - a block with near-zero loss adds patches but no
# positives, which is worse than useless at ~0.3% prevalence.
# `target_gsd_m` and the acquisition window are shared (see time_windows).
# ---------------------------------------------------------------------------
target_gsd_m: 10             # Sentinel-2 native 10 m; 20 m bands resampled to 10 m

regions:
  - id: "wayanad"
    name: "Wayanad Plateau, Western Ghats, Kerala, India"
    country: "India"
    bbox: { wsen: [76.00, 11.55, 76.28, 11.80] }
    utm_epsg: 32643
    gfc_loss_ha_2019_20: 237.0        # from the site probe, treecover2000>=30% & datamask==1
    admin_context: >
      Wayanad district, Kerala, on the Deccan/Western Ghats plateau margin.
      Semi-evergreen and moist-deciduous forest, plantation (tea, coffee,
      cardamom) and smallholder agriculture. Fragmented smallholder loss, not
      arc-of-deforestation clearing. The Phase 1-7 region; kept unchanged.
  - id: "kodagu"
    name: "Kodagu (Madikeri), Western Ghats, Karnataka, India"
    country: "India"
    bbox: { wsen: [75.60, 12.30, 75.88, 12.55] }
    utm_epsg: 32643
    gfc_loss_ha_2019_20: 235.0
    admin_context: >
      Kodagu district around Madikeri. Wet evergreen and semi-evergreen forest
      interleaved with coffee estates; loss is a mix of estate expansion and
      smallholder clearing. Only ~21 clear Sentinel-2 scenes per window but low
      median cloud (~6-7%).
  - id: "nilgiris"
    name: "Nilgiris (Ooty), Western Ghats, Tamil Nadu, India"
    country: "India"
    bbox: { wsen: [76.60, 11.35, 76.88, 11.60] }
    utm_epsg: 32643
    gfc_loss_ha_2019_20: 181.9
    admin_context: >
      Nilgiris plateau around Udhagamandalam (Ooty). Shola-grassland mosaic and
      montane wet forest with tea and eucalyptus; the highest positive
      prevalence of the four blocks (~0.45% of forest).
  - id: "anamalai"
    name: "Anamalai / Valparai, Western Ghats, Tamil Nadu, India"
    country: "India"
    bbox: { wsen: [76.85, 10.25, 77.13, 10.50] }
    utm_epsg: 32643
    gfc_loss_ha_2019_20: 138.9
    admin_context: >
      Valparai plateau and the Anamalai foothills. Tropical wet evergreen forest
      fragmented by tea estates inside a tiger-reserve landscape. Highest T+1
      cloud of the four (~13% median) - Cloud Score+ masking over ~42 scenes.

# Western Ghats domain extent - the union bounding box the Phase 9 app will
# accept custom bboxes inside. Outside this, the model is out of domain.
domain_extent_wsen: [74.8, 8.2, 77.9, 16.5]

# ---------------------------------------------------------------------------
# Bi-temporal windows. Dry season (NE monsoon retreat -> pre-SW monsoon) to
# minimise cloud. Sentinel-2 L2A (COPERNICUS/S2_SR_HARMONIZED) is the primary
# source; global L2A coverage is reliable from 2019 onward, so the T window is
# kept at/after 2019-01. Fallback: L1C (COPERNICUS/S2_HARMONIZED) + manual
# scaling if too few clear L2A scenes — to be decided in Phase 2, not assumed.
# ---------------------------------------------------------------------------
time_windows:
  T:
    label: "2019"
    start: "2019-01-01"
    end:   "2019-04-15"
    note: "Post-NE-monsoon dry window; least cloud over the Ghats."
  T_plus_1:
    label: "2021"
    start: "2021-01-01"
    end:   "2021-04-15"
    note: "Same seasonal window two years later for phenological comparability."

# ---------------------------------------------------------------------------
# Sentinel-2 band selection: 4 bands per timepoint -> 8-band stack.
# Order is fixed and used everywhere downstream.
# ---------------------------------------------------------------------------
bands:
  selected: ["B3", "B4", "B8", "B11"]
  names:    ["green", "red", "nir", "swir1"]
  native_gsd_m: {B3: 10, B4: 10, B8: 10, B11: 20}
  rationale: >
    B4 (red) + B8 (NIR) give NDVI, which is both the primary vegetation-
    structure cue for segmentation and the input to the Phase 6 carbon model.
    B3 (green) adds canopy-vigour / water separation and enables a green-NIR
    false-colour check. B11 (SWIR1) is highly sensitive to canopy moisture and
    exposed soil, making freshly cleared land, burn scars and dry non-forest
    separable from intact canopy. B2 (blue) is deliberately dropped: at 10 m it
    is dominated by atmospheric haze and adds little class separability over
    green. SWIR1 (B11) is preferred over SWIR2 (B12) because B11 has stronger
    vegetation-moisture contrast, while B12 leans toward mineral/geologic
    response. B11 (20 m) is bilinearly resampled to 10 m during preprocessing.
  stack_layout: >
    Channel order in the 8-band tensor:
    [T_green, T_red, T_nir, T_swir1, T1_green, T1_red, T1_nir, T1_swir1].

# ---------------------------------------------------------------------------
# Ground truth: Hansen Global Forest Change (GFC).
# Dataset: UMD/hansen/global_forest_change_2023_v1_11 (or latest v1.x at
# Phase 2 time — record the exact version used).
#
# GFC 'lossyear' is a year-of-loss code (1..N for 2001..200N), NOT a binary
# T-vs-T+1 mask. Conversion is its own documented sub-step in Phase 2:
#   - forest baseline: treecover2000 >= canopy_threshold_pct  -> "forest at 2000"
#   - deforestation (positive class): pixels where forest-at-2000 AND
#     lossyear IN loss_year_codes
#   - everything else -> non-forest / no-change
# Loss-year codes 19 and 20 are used because the T image (early 2019) captures
# the forest state entering 2019 and the T+1 image (early 2021) captures the
# state entering 2021, so calendar-2019 and calendar-2020 loss falls between
# the two acquisitions. Revisit if Phase 2 acquisition dates shift.
# ---------------------------------------------------------------------------
ground_truth:
  source: "Hansen Global Forest Change"
  gee_asset: "UMD/hansen/global_forest_change_2024_v1_12"
  gee_asset_note: >
    Confirmed available in Phase 2 (13 bands). This is the current
    non-deprecated release; the 2023_v1_11 asset now emits a deprecation
    warning. lossyear codes 1..24 (2001..2024); our window uses 19 & 20.
  canopy_threshold_pct: 30
  loss_year_codes: [19, 20]
  positive_class: "new forest loss between T and T+1"

# ---------------------------------------------------------------------------
# Patching / splits (executed in Phase 2).
# ---------------------------------------------------------------------------
patching:
  patch_size_px: 256
  stride_px: 256           # non-overlapping canonical set; train-time overlap decided in Phase 3
  split_fractions: {train: 0.70, val: 0.15, test: 0.15}
  split_unit: "patch"
  split_seed: 42
  split_block_patches: 2   # 2x2-patch (512 px) super-blocks assigned whole to one split
  train_overlap_stride_px: 128   # extra overlapping patches, TRAIN blocks only, to enlarge the train set
  split_note: >
    Spatially blocked split: patches are grouped into split_block_patches^2
    super-blocks and whole blocks go to one split, so no test patch is
    edge-adjacent to a train patch. Actual per-split patch counts and positive
    rates are reported in data/processed/split.json.

compute:
  local_gpu: "NVIDIA GeForce RTX 3050 Laptop 6 GB"
  notes: >
    6 GB VRAM constrains batch size at 256x256; plan batch_size 4-8 with
    mixed precision. Colab (no guaranteed GPU, ~4 h sessions) is the fallback.
